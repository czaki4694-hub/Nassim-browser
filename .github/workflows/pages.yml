name: Deploy from zip
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: |
          unzip -q nasim-browser.zip -d site
          test -f site/nasim-browser/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/nasim-browser
      - id: deployment
        uses: actions/deploy-pages@v4
